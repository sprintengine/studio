      The embeddable conversation view (phase 9 spec, 5.4): one conversation,

      /embed/conversation/<id>, framed only by the embed's own origins. Its
      token arrives in the fragment (or from the framing page by postMessage)
      and is traded for a single-use socket ticket.
    -->
