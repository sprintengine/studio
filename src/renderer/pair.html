<!DOCTYPE html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Pair this browser · SprintEngine Studio</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/brand/sprintengine/mark-on-dark.svg" />
    <!--
      The pairing page a Studio server shows a browser that holds no session
      (phase 9 spec, 6.2). Standalone on purpose: it loads none of the app's
      bundle, so a browser that is not paired fetches nothing it cannot use.
      A pairing link carries its one-time code in the fragment, which never
      reaches a server, a log or a Referer; the page reads it, removes it from
      the address and history, and spends it with one POST.
    -->
  </head>
  <body>
    <main class="pair">
      <img class="pair-mark" src="./src/assets/brand/sprintengine/mark-on-dark.svg" alt="" width="40" height="40" />
      <h1 class="pair-title">Pair this browser with Studio</h1>
      <p id="pair-status" class="pair-status" role="status" aria-live="polite">Checking this browser…</p>
      <section id="pair-help" class="pair-help" hidden aria-labelledby="pair-help-title">
        <h2 id="pair-help-title" class="pair-help-title">Get a pairing link</h2>
        <p>On the machine Studio runs on, run:</p>
        <pre class="pair-command"><code>studio-server pair</code></pre>
        <p>Open the link it prints in this browser. It works once, within five minutes.</p>
      </section>
    </main>
    <script type="module" src="/src/web/pair/pairPage.ts"></script>
  </body>
</html>
