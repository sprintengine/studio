# The repo's Python suite lives entirely under tests/. Scoping collection there
# is not cosmetic: a bare `pytest` at the repo root walks the vendored
# third-party skill payloads under resources/marketplace/skills/**, dies with 25
# collection errors before running a single test, and leaves __pycache__/*.pyc
# inside those payloads — which then fails `npm run verify:marketplace-registry`,
# because bundled skills are digest-verified against an exact file listing.
[pytest]
testpaths = tests
