# The repo's Python suite lives entirely under tests/, and collection is scoped
# there on purpose. The reason it was first scoped is gone: a bare `pytest` at
# the repo root used to walk the vendored third-party skill payloads under
# resources/marketplace/skills/**, die with 25 collection errors, and leave
# __pycache__/*.pyc inside those payloads — which then failed
# `npm run verify:marketplace-registry`, because bundled skills are
# digest-verified against an exact file listing. Those frozen snapshots were
# retired (8d8a3a8dd), so a root walk now collects the same 1062 tests cleanly.
# The scope stays because it is what keeps the next payload dropped anywhere in
# the tree from re-creating that failure, and because it costs nothing.
[pytest]
testpaths = tests
