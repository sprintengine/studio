<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code block</title><link rel="stylesheet" href="../../foundations/tokens.css"><link rel="stylesheet" href="../button/component.css"><link rel="stylesheet" href="component.css"></head><body>
<section class="ds-code-block" aria-label="TypeScript code">
  <header class="ds-code-block__header"><span class="ds-code-block__label">TypeScript · greeting.ts</span><button class="ds-button ds-button--ghost" aria-pressed="false">Wrap</button><button class="ds-button ds-button--ghost">Copy</button></header>
  <pre><code><span style="color:var(--sem-syntax-keyword)">const</span> greeting = <span style="color:var(--sem-syntax-string)">"Hello"</span></code></pre>
</section>
<div data-mode="dark">
  <section class="ds-code-block ds-code-block--wrap" aria-label="Wrapped TypeScript code">
    <header class="ds-code-block__header"><span class="ds-code-block__label">TypeScript</span><button class="ds-button ds-button--ghost" aria-pressed="true">Wrap</button><button class="ds-button ds-button--ghost" disabled>Copy</button></header>
    <pre><code><span style="color:var(--sem-syntax-comment)">// Streaming code stays selectable</span>
<span style="color:var(--sem-syntax-keyword)">return</span> greeting</code></pre>
  </section>
</div>
</body></html>
