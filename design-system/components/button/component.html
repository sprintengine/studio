<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Button</title>
<link rel="stylesheet" href="../../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  body {
    margin: 0;
    font-family: var(--sem-font-family-ui);
  }
  .demo-stage {
    padding: var(--sem-space-3xl);
    background: var(--sem-color-bg-app);
    color: var(--sem-color-text-default);
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: var(--sem-space-md);
    flex-wrap: wrap;
    margin: 0 0 var(--sem-space-lg);
  }
  .demo-row:last-child {
    margin-bottom: 0;
  }
  .demo-label {
    font-size: var(--sem-font-size-meta);
    color: var(--sem-color-text-subtle);
    width: 100%;
  }
</style>
</head>
<body>
<div class="demo-stage" data-mode="light">
  <p class="demo-label">Light</p>
  <div class="demo-row">
    <button type="button" class="ds-button ds-button--primary">Create workspace</button>
    <button type="button" class="ds-button ds-button--outline">Revoke others</button>
    <button type="button" class="ds-button ds-button--ghost">Cancel</button>
    <button type="button" class="ds-button ds-button--icon" aria-label="Close">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.25 3.25L10.75 10.75M10.75 3.25L3.25 10.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-button ds-button--primary ds-button--md">Medium primary</button>
    <button type="button" class="ds-button ds-button--primary" disabled>Disabled</button>
    <button type="button" class="ds-button ds-button--outline" disabled>Disabled outline</button>
    <button type="button" class="ds-button ds-button--ghost" disabled>Disabled ghost</button>
  </div>
  <div class="demo-row">
    <span style="font-size: var(--sem-font-size-meta); color: var(--sem-color-text-muted)">Queued behind <button type="button" class="ds-button ds-button--ghost ds-button--inline">MC-2118</button> — an inline size rides this line</span>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-button ds-button--ghost ds-button--armed">Press a chord…</button>
    <button type="button" class="ds-button ds-button--ghost" aria-busy="true">Opening…</button>
    <button type="button" class="ds-button ds-button--ghost" aria-disabled="true">Annotate</button>
    <button type="button" class="ds-button ds-button--ghost ds-button--start" style="width: 160px">Left-aligned</button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-button ds-button--icon ds-button--icon-xs" aria-label="Reload">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M11 7a4 4 0 1 1-1.2-2.8M11 2v3H8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="ds-button ds-button--icon ds-button--icon-2xs" aria-label="Add tab">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 3v8M3 7h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="ds-button ds-button--icon ds-button--icon-3xs" aria-label="Remove">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="ds-button ds-button--icon ds-button--icon-3xs ds-button--circle" aria-label="What this means">
      <span style="font-size: var(--sem-font-size-micro)">?</span>
    </button>
  </div>
  <div class="demo-row" style="align-items: stretch; height: 32px; gap: 0; background: var(--sem-color-bg-surface)">
    <span style="flex: 1"></span>
    <button type="button" class="ds-caption-button" aria-label="Minimize window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M3.5 8H12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="ds-caption-button" aria-label="Maximize window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M4 4H12V12H4V4Z" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button type="button" class="ds-caption-button ds-caption-button--close" aria-label="Close window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div class="demo-stage" data-mode="dark">
  <p class="demo-label">Dark</p>

    <button type="button" class="ds-button ds-button--ghost" disabled>Disabled ghost</button>

    <button type="button" class="ds-button ds-button--ghost" aria-busy="true">Opening…</button>
    <button type="button" class="ds-button ds-button--ghost" aria-disabled="true">Annotate</button>
    <button type="button" class="ds-button ds-button--ghost ds-button--start" style="width: 160px">Left-aligned</button>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-button ds-button--icon ds-button--icon-xs" aria-label="Reload">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M11 7a4 4 0 1 1-1.2-2.8M11 2v3H8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>

    </button>
    <button type="button" class="ds-button ds-button--icon ds-button--icon-3xs ds-button--circle" aria-label="What this means">
      <span style="font-size: var(--sem-font-size-micro)">?</span>
    </button>
  </div>
  <div class="demo-row" style="align-items: stretch; height: 32px; gap: 0; background: var(--sem-color-bg-surface)">
    <span style="flex: 1"></span>
    <button type="button" class="ds-caption-button" aria-label="Minimize window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M3.5 8H12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="ds-caption-button" aria-label="Maximize window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M4 4H12V12H4V4Z" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button type="button" class="ds-caption-button ds-caption-button--close" aria-label="Close window">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="16" height="16"><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
</body>
</html>
