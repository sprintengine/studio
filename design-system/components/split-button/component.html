<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Split button</title>
<link rel="stylesheet" href="../../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  body {
    margin: 0;
    font-family: var(--sem-font-family-ui);
  }
  .demo-stage {
    padding: var(--sem-space-3xl);
    background: var(--sem-color-bg-app);
    color: var(--sem-color-text-default);
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: var(--sem-space-md);
    flex-wrap: wrap;
    margin: 0 0 var(--sem-space-lg);
  }
  .demo-row:last-child {
    margin-bottom: 0;
  }
  .demo-label {
    font-size: var(--sem-font-size-meta);
    color: var(--sem-color-text-subtle);
    width: 100%;
  }
  /* The menu is a standard popover surface, not part of this component. It is
     drawn here only to show the open state's anatomy: the checked default and
     the shortcut hint. */
  .demo-menu {
    min-width: 200px;
    padding: var(--sem-space-2xs);
    border: 1px solid var(--sem-color-border-default);
    border-radius: var(--sem-radius-overlay);
    background: var(--sem-color-bg-surface-raised);
    box-shadow: var(--sem-shadow-popover);
  }
  .demo-item {
    display: flex;
    align-items: center;
    gap: var(--sem-space-sm);
    width: 100%;
    padding: var(--sem-space-xs) var(--sem-space-sm);
    border: none;
    border-radius: var(--sem-radius-control);
    background: transparent;
    color: var(--sem-color-text-default);
    font-family: var(--sem-font-family-ui);
    font-size: var(--sem-font-size-meta);
    text-align: left;
    cursor: pointer;
  }
  .demo-item:hover {
    background: var(--sem-color-bg-hover);
    color: var(--sem-color-text-primary);
  }
  .demo-trail {
    margin-left: auto;
    color: var(--sem-color-text-subtle);
    font-family: var(--sem-font-family-mono);
    font-size: var(--sem-font-size-micro);
  }
</style>
</head>
<body>
<div class="demo-stage" data-mode="light">
  <p class="demo-label">Light — at rest, held open, md size, disabled</p>
  <div class="demo-row">
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" aria-label="Open in VS Code">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" aria-label="Open in IntelliJ IDEA">
        <span class="ds-split-button__glyph" aria-hidden="true">IJ</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="true">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button ds-split-button--md">
      <button type="button" class="ds-split-button__primary">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" disabled>
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" disabled>
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
  </div>
  <div class="demo-row">
    <div class="demo-menu" role="menu" aria-label="Open in">
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="true">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>VS Code<span class="demo-trail">✓</span>
      </button>
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="false">
        <span class="ds-split-button__glyph" aria-hidden="true">IJ</span>IntelliJ IDEA
      </button>
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="false">
        <span class="ds-split-button__glyph" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2.1 4.4a1.3 1.3 0 0 1 1.3-1.3h2.6l1.4 1.5h5.2a1.3 1.3 0 0 1 1.3 1.3v5.4a1.3 1.3 0 0 1-1.3 1.3H3.4a1.3 1.3 0 0 1-1.3-1.3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </span>Finder<span class="demo-trail">⌘O</span>
      </button>
    </div>
  </div>
</div>
<div class="demo-stage" data-mode="dark">
  <p class="demo-label">Dark — at rest, held open, md size, disabled</p>
  <div class="demo-row">
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" aria-label="Open in VS Code">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" aria-label="Open in IntelliJ IDEA">
        <span class="ds-split-button__glyph" aria-hidden="true">IJ</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="true">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button ds-split-button--md">
      <button type="button" class="ds-split-button__primary">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="ds-split-button">
      <button type="button" class="ds-split-button__primary" disabled>
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>Open
      </button>
      <button type="button" class="ds-split-button__chevron" aria-label="Open in…" aria-haspopup="menu" disabled>
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 6.5L8 10L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
  </div>
  <div class="demo-row">
    <div class="demo-menu" role="menu" aria-label="Open in">
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="true">
        <span class="ds-split-button__glyph" aria-hidden="true">VS</span>VS Code<span class="demo-trail">✓</span>
      </button>
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="false">
        <span class="ds-split-button__glyph" aria-hidden="true">IJ</span>IntelliJ IDEA
      </button>
      <button type="button" class="demo-item" role="menuitemcheckbox" aria-checked="false">
        <span class="ds-split-button__glyph" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2.1 4.4a1.3 1.3 0 0 1 1.3-1.3h2.6l1.4 1.5h5.2a1.3 1.3 0 0 1 1.3 1.3v5.4a1.3 1.3 0 0 1-1.3 1.3H3.4a1.3 1.3 0 0 1-1.3-1.3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </span>Finder<span class="demo-trail">⌘O</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
