<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Attachment chip</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="../button/component.css" />
    <link rel="stylesheet" href="../chip-button/component.css" />
    <link rel="stylesheet" href="component.css" />
  </head>
  <body>
    <div class="ds-demo-row">
      <span class="ds-attachment-chip"
        ><span class="ds-attachment-chip-label">Review</span
        ><button class="ds-button ds-button--icon" aria-label="Remove Review">×</button></span
      >
      <span class="ds-attachment-chip"
        ><button class="ds-chip-button">Inspect skill</button
        ><button class="ds-button ds-button--icon" aria-label="Remove inspected skill">×</button></span
      >
      <span class="ds-attachment-chip"
        ><span class="ds-attachment-chip-label">Unavailable</span
        ><button class="ds-button ds-button--icon" disabled aria-label="Remove unavailable context">×</button></span
      >
    </div>
    <div class="ds-demo-row">
      <span class="ds-attachment-chip ds-attachment-chip--file"
        ><button class="ds-attachment-chip-file-open" aria-label="Open Quarterly re…final.pdf"
          ><span class="ds-attachment-chip-file-preview"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" aria-hidden="true"><path d="M4.25 1.75h5.4l2.1 2.1v10.4H4.25a1.5 1.5 0 0 1-1.5-1.5v-9.5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg></span
          ><span class="ds-attachment-chip-file-caption"
            ><span class="ds-attachment-chip-label">Quarterly re…final.pdf</span
            ><span class="ds-attachment-chip-file-type">PDF</span></span
          ></button
        ><button class="ds-button ds-button--icon" aria-label="Remove Quarterly re…final.pdf">×</button></span
      >
      <span class="ds-attachment-chip ds-attachment-chip--file"
        ><button class="ds-attachment-chip-file-open" aria-label="Open budget.xlsx"
          ><span class="ds-attachment-chip-file-preview"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" aria-hidden="true"><path d="M4.25 1.75h5.4l2.1 2.1v10.4H4.25a1.5 1.5 0 0 1-1.5-1.5v-9.5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg></span
          ><span class="ds-attachment-chip-file-caption"
            ><span class="ds-attachment-chip-label">budget.xlsx</span
            ><span class="ds-attachment-chip-file-type">XLSX</span></span
          ></button
        ><button class="ds-button ds-button--icon" aria-label="Remove budget.xlsx">×</button></span
      >
    </div>
    <div class="ds-demo-row" data-mode="dark">
      <span class="ds-attachment-chip"
        ><span class="ds-attachment-chip-label">src/app.ts</span
        ><button class="ds-button ds-button--icon" aria-label="Remove src/app.ts">×</button></span
      >
      <span class="ds-attachment-chip"
        ><button class="ds-chip-button">Inspect skill</button
        ><button class="ds-button ds-button--icon" aria-label="Remove inspected skill">×</button></span
      >
    </div>
    <div class="ds-demo-row" data-mode="dark">
      <span class="ds-attachment-chip ds-attachment-chip--file"
        ><button class="ds-attachment-chip-file-open" aria-label="Open deck.pptx"
          ><span class="ds-attachment-chip-file-preview"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" aria-hidden="true"><path d="M4.25 1.75h5.4l2.1 2.1v10.4H4.25a1.5 1.5 0 0 1-1.5-1.5v-9.5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg></span
          ><span class="ds-attachment-chip-file-caption"
            ><span class="ds-attachment-chip-label">deck.pptx</span
            ><span class="ds-attachment-chip-file-type">PPTX</span></span
          ></button
        ><button class="ds-button ds-button--icon" aria-label="Remove deck.pptx">×</button></span
      >
    </div>
  </body>
</html>
