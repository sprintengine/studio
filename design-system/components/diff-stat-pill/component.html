<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diff stat pill</title>
    <link rel="stylesheet" href="../../foundations/tokens.css" />
    <link rel="stylesheet" href="component.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--sem-font-family-ui);
      }
      .demo-stage {
        padding: var(--sem-space-3xl);
        background: var(--sem-color-bg-app);
        color: var(--sem-color-text-default);
      }
      .demo-label {
        margin: 0 0 var(--sem-space-sm);
        font-size: var(--sem-font-size-meta);
        color: var(--sem-color-text-subtle);
      }
      /* The strip the pill lives on: one line, items apart by spacing alone. */
      .demo-strip {
        display: flex;
        align-items: center;
        gap: var(--sem-space-sm);
        max-width: 420px;
        margin-bottom: var(--sem-space-lg);
        padding: var(--sem-space-xs) var(--sem-space-sm);
        border: 1px solid var(--sem-color-border-subtle);
        border-radius: var(--sem-radius-control);
        background: var(--sem-color-bg-surface);
        white-space: nowrap;
      }
      .demo-branch {
        font-family: var(--sem-font-family-mono);
        font-size: var(--sem-font-size-meta);
        color: var(--sem-color-text-subtle);
      }
    </style>
  </head>
  <body>
    <div class="demo-stage" data-mode="light">
      <p class="demo-label">
        Light — files added or updated, and files removed, as the strip under a conversation shows them.
      </p>
      <div class="demo-strip">
        <span class="demo-branch">fix/cli-update-output</span>
        <button
          type="button"
          class="ds-diff-stat-pill ds-diff-stat-pill--action"
          aria-label="3 files updated, 2 removed — open changes"
        >
          <span class="ds-diff-stat-pill-added" aria-hidden="true">+3</span>
          <span class="ds-diff-stat-pill-removed" aria-hidden="true">−2</span>
        </button>
      </div>
      <p class="demo-label">Only additions: the pill is its green half alone. Only removals: its red half alone.</p>
      <div class="demo-strip">
        <span class="ds-diff-stat-pill" role="img" aria-label="4 files added">
          <span class="ds-diff-stat-pill-added">+4</span>
        </span>
        <span class="ds-diff-stat-pill" role="img" aria-label="1 file removed">
          <span class="ds-diff-stat-pill-removed">−1</span>
        </span>
      </div>
    </div>

    <div class="demo-stage" data-mode="dark">
      <p class="demo-label">Dark — the same inks and washes, retuned by the tokens.</p>
      <div class="demo-strip">
        <span class="demo-branch">…rename-module</span>
        <button
          type="button"
          class="ds-diff-stat-pill ds-diff-stat-pill--action"
          aria-label="12 files updated, 3 removed — open changes"
        >
          <span class="ds-diff-stat-pill-added" aria-hidden="true">+12</span>
          <span class="ds-diff-stat-pill-removed" aria-hidden="true">−3</span>
        </button>
      </div>
    </div>
  </body>
</html>
