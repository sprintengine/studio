<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wizard progress</title>
<link rel="stylesheet" href="../../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  body { margin: 0; font-family: var(--sem-font-family-ui); }
  .demo-stage {
    padding: var(--sem-space-3xl);
    background: var(--sem-color-bg-app);
    color: var(--sem-color-text-default);
  }
  .demo-label {
    margin: 0 0 var(--sem-space-sm);
    font-size: var(--sem-font-size-meta);
    color: var(--sem-color-text-subtle);
  }
  .demo-box { max-width: 420px; margin-bottom: var(--sem-space-3xl); }
</style>
</head>
<body>
  <div class="demo-stage">
    <div class="demo-box">
      <p class="demo-label">Dashes — short flow, position is the whole message</p>
      <div class="ds-wizard" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3" aria-label="Step 3 of 4: Roster">
        <span class="ds-wizard-step" data-state="done"></span>
        <span class="ds-wizard-step" data-state="done"></span>
        <span class="ds-wizard-step" data-state="current" aria-current="step"></span>
        <span class="ds-wizard-step" data-state="upcoming"></span>
      </div>
    </div>

    <div class="demo-box">
      <p class="demo-label">Labeled — past four steps, people need to know which stations they passed</p>
      <div class="ds-wizard ds-wizard--labeled" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3" aria-label="Step 3 of 4: Roster">
        <span class="ds-wizard-step" data-state="done">
          <svg class="ds-wizard-glyph" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <button type="button" class="ds-wizard-jump">Project</button>
        </span>
        <span class="ds-wizard-step" data-state="done">
          <svg class="ds-wizard-glyph" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <button type="button" class="ds-wizard-jump">Goal</button>
        </span>
        <span class="ds-wizard-step" data-state="current" aria-current="step">Roster</span>
        <span class="ds-wizard-step" data-state="upcoming">Review</span>
      </div>
    </div>
  </div>
</body>
</html>
