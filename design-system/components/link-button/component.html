<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Link button</title>
<link rel="stylesheet" href="../../foundations/tokens.css" />
<link rel="stylesheet" href="component.css" />
<style>
  body {
    margin: 0;
    font-family: var(--sem-font-family-ui);
  }
  .demo-stage {
    padding: var(--sem-space-3xl);
    background: var(--sem-color-bg-app);
    color: var(--sem-color-text-default);
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: var(--sem-space-md);
    flex-wrap: wrap;
    margin: 0 0 var(--sem-space-lg);
  }
  .demo-row:last-child {
    margin-bottom: 0;
  }
  .demo-label {
    font-size: var(--sem-font-size-meta);
    color: var(--sem-color-text-subtle);
    width: 100%;
  }
  .demo-panel {
    width: 260px;
    padding: var(--sem-space-sm);
    border: 1px solid var(--sem-color-border-subtle);
    border-radius: var(--sem-radius-shell);
    background: var(--sem-color-bg-surface);
  }
</style>
</head>
<body>
<div class="demo-stage" data-mode="light">
  <p class="demo-label">Light</p>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-meta); color: var(--sem-color-text-muted); margin: 0">
      Signed out · <button type="button" class="ds-link-button">Reconnect</button>
    </p>
  </div>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-meta); color: var(--sem-color-text-muted); margin: 0; max-width: 340px">
      Walks the repository and lists every skill it finds.
      <button type="button" class="ds-link-button ds-link-button--quiet" aria-expanded="false">More</button>
    </p>
  </div>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-body); margin: 0">
      Changed in <button type="button" class="ds-link-button ds-link-button--inherit">src/renderer/src/components/ui/Buttons.tsx</button> this morning.
    </p>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-link-button" disabled>Reconnect</button>
  </div>
</div>
<div class="demo-stage" data-mode="dark">
  <p class="demo-label">Dark</p>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-meta); color: var(--sem-color-text-muted); margin: 0">
      Signed out · <button type="button" class="ds-link-button">Reconnect</button>
    </p>
  </div>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-meta); color: var(--sem-color-text-muted); margin: 0; max-width: 340px">
      Walks the repository and lists every skill it finds.
      <button type="button" class="ds-link-button ds-link-button--quiet" aria-expanded="false">More</button>
    </p>
  </div>
  <div class="demo-row">
    <p style="font-size: var(--sem-font-size-body); margin: 0">
      Changed in <button type="button" class="ds-link-button ds-link-button--inherit">src/renderer/src/components/ui/Buttons.tsx</button> this morning.
    </p>
  </div>
  <div class="demo-row">
    <button type="button" class="ds-link-button" disabled>Reconnect</button>
  </div>
</div>
</body>
</html>
