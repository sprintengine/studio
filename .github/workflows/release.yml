name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to a GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: publish
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=always" >> "$GITHUB_OUTPUT"
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"
          fi

      # A tag release publishes to another repo, so the only credential that can
      # do it is RELEASES_TOKEN. When that secret is absent `${{ secrets.X }}`
      # expands to an empty string, electron-builder throws `GitHub Personal
      # Access Token is not set` -- but only in the LAST step of a 12-minute
      # matrix job, four times over. Check it here, before anything is built.
      - name: Confirm the releases token is present
        if: steps.publish.outputs.publish == 'always'
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "${RELEASES_TOKEN}" ]; then
            echo "RELEASES_TOKEN is not set on this repository." >&2
            echo "It is a fine-grained PAT with Contents read/write on" >&2
            echo "sprintengine/studio-releases only. Add it under" >&2
            echo "Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Test mobile sprintengine command
        run: npm run test:main:mobile-sprintengine-command

      - name: Validate registry and plugin signatures
        run: npm run verify:marketplace-registry

      - name: Exercise valid and tampered marketplace submissions
        run: npm run test:marketplace-publish

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            builderArgs: --win
            artifactName: multicode-windows
          - name: macos-x64
            os: macos-15-intel
            builderArgs: --mac --x64
            artifactName: multicode-macos-x64
          - name: macos-arm64
            os: macos-latest
            builderArgs: --mac --arm64
            artifactName: multicode-macos-arm64
          - name: linux
            os: ubuntu-latest
            builderArgs: --linux
            artifactName: multicode-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer and main process
        run: npm run build

      # Packaging is split by runner ONLY so the macOS signing variables never
      # reach the Windows one. `getCscLink` in app-builder-lib resolves the
      # Windows certificate as `WIN_CSC_LINK ?? CSC_LINK`, so a CSC_LINK set on
      # every matrix job hands the Developer ID .p12 to the Windows job, which
      # then fails trying to Authenticode-sign with it. Same command, same
      # publish mode, different env. See build/SIGNING.md.
      - name: Package app (macOS, signed and notarized)
        if: runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.builderArgs }} --publish ${{ needs.validate.outputs.publish }}
        env:
          # Releases are published to the PUBLIC sprintengine/studio-releases
          # repo (build.publish in package.json), which electron-updater and the
          # website read without auth. The workflow's own GITHUB_TOKEN cannot
          # write to another repo, so this is a fine-grained PAT with Contents
          # read/write on studio-releases only. Source never goes there.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Developer ID Application: Conal Smith (EXAMPLETEAM), expires
          # 2027-02-01. build.mac.notarize is true, so the CSC_* pair and the
          # APPLE_* trio are all load-bearing: a certificate without
          # notarisation credentials signs the app and then fails the notarise
          # step, turning a green release red. Never add WIN_CSC_* here.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package app (Windows and Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builderArgs }} --publish ${{ needs.validate.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Unsigned by design, for now. Windows signing needs an OV/EV
          # certificate on a hardware token or a cloud signing service; when it
          # arrives, WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or the AZURE_* set)
          # go HERE, never in the macOS step and never at job level.

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        # Retention-only convenience (mainly for workflow_dispatch publish=false
        # runs). For tag releases electron-builder already publishes the installers
        # to the GitHub Release, so a transient/quota upload failure here must not
        # fail the release.
        continue-on-error: true
        with:
          name: ${{ matrix.artifactName }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/**
            !dist/**/win-unpacked/**
            !dist/**/mac/**
            !dist/**/mac-*/**
            !dist/**/linux-unpacked/**

  # v0.3.0 is why this job exists. That run went green on all five jobs and
  # published nothing to studio-releases: at that commit build.publish still
  # named the PRIVATE studio repo, so electron-builder happily uploaded four
  # installers where neither the updater nor the website can read them, and
  # said so only in a line of packaging log nobody reads. A release that
  # publishes to the wrong place, or to no place, must not report success.
  verify-published:
    name: Verify published release
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'always'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the release exists on studio-releases with its installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          REPO="sprintengine/studio-releases"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release ${TAG} on ${REPO}." >&2
            echo "The packaging jobs went green, so electron-builder either" >&2
            echo "published somewhere else (check build.publish in package.json)" >&2
            echo "or did not publish at all." >&2
            exit 1
          fi

          ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          echo "Assets on ${TAG}:"
          echo "${ASSETS}" | sed 's/^/  /'

          # The updater reads latest*.yml; the website matches installers by
          # extension. Missing either is a release nobody can actually install.
          MISSING=""
          for want in "latest.yml" "latest-mac.yml"; do
            echo "${ASSETS}" | grep -qx "${want}" || MISSING="${MISSING} ${want}"
          done
          echo "${ASSETS}" | grep -qE '\.dmg$'      || MISSING="${MISSING} a .dmg"
          echo "${ASSETS}" | grep -qE '\.exe$'      || MISSING="${MISSING} a .exe"
          echo "${ASSETS}" | grep -qE '\.AppImage$' || MISSING="${MISSING} an .AppImage"

          if [ -n "${MISSING}" ]; then
            echo "Release ${TAG} is missing:${MISSING}" >&2
            exit 1
          fi

          echo "Release ${TAG} is complete on ${REPO}."
