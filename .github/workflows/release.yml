name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to a GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: publish
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=always" >> "$GITHUB_OUTPUT"
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Test mobile sprintengine command
        run: npm run test:main:mobile-sprintengine-command

      - name: Validate registry and plugin signatures
        run: npm run verify:marketplace-registry

      - name: Exercise valid and tampered marketplace submissions
        run: npm run test:marketplace-publish

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            builderArgs: --win
            artifactName: multicode-windows
          - name: macos-x64
            os: macos-15-intel
            builderArgs: --mac --x64
            artifactName: multicode-macos-x64
          - name: macos-arm64
            os: macos-latest
            builderArgs: --mac --arm64
            artifactName: multicode-macos-arm64
          - name: linux
            os: ubuntu-latest
            builderArgs: --linux
            artifactName: multicode-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer and main process
        run: npm run build

      - name: Package app
        run: npx electron-builder ${{ matrix.builderArgs }} --publish ${{ needs.validate.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing. Every value below is optional: with the secret unset the
          # variable is empty, electron-builder finds no identity, and it skips
          # signing exactly as it does today. See build/SIGNING.md for how to
          # obtain each one.
          #
          # ORDER MATTERS on macOS: `build.mac.notarize` is true, so adding
          # CSC_LINK *without* the APPLE_* credentials produces a signed app that
          # then fails at the notarize step. Add the certificate and the
          # notarization credentials in the same change, never one before the other.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (Apple ID method — plain strings, no key file).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode, when the cert is a .pfx rather than a cloud
          # signing service. Kept separate from CSC_LINK so the mac and win
          # certificates never collide on the shared variable.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        # Retention-only convenience (mainly for workflow_dispatch publish=false
        # runs). For tag releases electron-builder already publishes the installers
        # to the GitHub Release, so a transient/quota upload failure here must not
        # fail the release.
        continue-on-error: true
        with:
          name: ${{ matrix.artifactName }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/**
            !dist/**/win-unpacked/**
            !dist/**/mac/**
            !dist/**/mac-*/**
            !dist/**/linux-unpacked/**
