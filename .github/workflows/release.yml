name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to a GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: publish
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=always" >> "$GITHUB_OUTPUT"
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            builderArgs: --win
            artifactName: multicode-windows
          - name: macos-x64
            os: macos-15-intel
            builderArgs: --mac --x64
            artifactName: multicode-macos-x64
          - name: macos-arm64
            os: macos-latest
            builderArgs: --mac --arm64
            artifactName: multicode-macos-arm64
          - name: linux
            os: ubuntu-latest
            builderArgs: --linux
            artifactName: multicode-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Test mobile sprintengine command
        run: npm run test:main:mobile-sprintengine-command

      - name: Build renderer and main process
        run: npm run build

      - name: Package app
        run: npx electron-builder ${{ matrix.builderArgs }} --publish ${{ needs.validate.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/**
            !dist/**/win-unpacked/**
            !dist/**/mac/**
            !dist/**/mac-*/**
            !dist/**/linux-unpacked/**
