name: CI

# MANUAL ONLY, on purpose. This used to fire on every push to main, where
# agent-authored commits land in bulk -- 225 in the 34h before this changed --
# at ~18 billed minutes a run once Windows' 2x multiplier is counted. Sep 2-5
# that was 73 runs and ~1337 billed minutes with 88% of the jobs red: half a
# month's Pro allowance spent re-proving the same failures. The pull_request
# trigger is deliberately absent too.
#
# Nothing checks main automatically any more. Run this by hand before a
# release, or accept that the release workflow's `validate` job (typecheck,
# marketplace verification, one test) is the only gate left -- and it fires
# after you have already decided to ship. Restore a trigger here the moment
# the minutes allow it; a public repo gets unlimited standard-runner minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      # The only test script this job still runs, and only on Windows: it is the
      # sole check ever measured on that platform. The Linux JS suite moved to
      # the js-tests job below, so a broken test no longer hides a broken build.
      - name: Test mobile sprintengine command
        if: runner.os == 'Windows'
        run: node scripts/testing/run-tests.mjs src/main/mobile/sprintengine/command.test.ts

      - name: Build
        run: npm run build

  # What the JS gate covers, and why: `verify:app` — the repo's OWN full-app
  # verification chain, seven &&-joined steps: typecheck, the six design lints
  # plus the guard probes that prove those lints still bite, the whole unit
  # suite, and the four SDK/feed guards (~4 min). Until MC-2070
  # CI ran exactly one hand-picked script out of the 422 the chain then named,
  # gating one file by accident rather than by decision. The chain is
  # deliberately named whole rather than curated: a hand-maintained subset is
  # how the gate got to one script in the first place. Those 422 one-off test
  # scripts have since collapsed into `npm run test`, which DISCOVERS its ~590
  # test files instead of listing them (scripts/testing/test-profiles.json), so
  # a new test file is in the gate the moment it is written and the subset
  # cannot silently shrink again.
  #
  # HONEST STATE, measured 2026-09-08 (MC-2146) on a clean `git archive` copy —
  # `main` itself was mid-restructure that day, so the copy is where the whole
  # chain could be run end to end: it exits 0 there. The six failures this job
  # arrived red with in August are gone. Four of the six were retired with the
  # surfaces they tested when the composer roster and the old doors went; the
  # two real defects the chain still carried are fixed at their root —
  #   * the module-SDK drift project could not see `src/shared/build-defines.d.ts`,
  #     so the build-time `define` constants read as undeclared names;
  #   * the bundled model feed listed a Fable 5 that the claude-code plugin
  #     manifest had dropped while it was retired upstream;
  # plus the tailnet upload ceiling, which answered 413 and only THEN drained
  # the refused body — on a `Connection: close` request Node destroys the socket
  # as that answer finishes, so the phone got a reset instead of the sentence.
  # Do not narrow this step to make the badge green.
  #
  # Linux only: `verify:app` has never been measured on Windows, and an
  # unmeasured chain of this size would fail that leg for reasons unrelated to
  # the change being merged.
  js-tests:
    name: JS tests (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not incidental: `test:main:sprintengine-artifacts` refuses to mock the
      # Sprint Engine store and spawns real Python against `sprintengine_core`,
      # which exits with "PyYAML is required" without it. It prefers the
      # repo-local `.venv` and falls back to system `python3` — and a runner's
      # system python3 has no PyYAML, so the chain needs this venv to pass.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create repo-local venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Verify app (lint + JS test suite)
        run: npm run verify:app

  # The Python suite runs in its own job rather than inside the matrix above: it
  # needs no Node toolchain, so it starts without waiting on `npm ci`, and it
  # runs on Linux only — the suite has only ever been measured on POSIX. Its own
  # checkout also keeps pytest's bytecode caches away from the marketplace
  # payloads the JS job digest-verifies.
  python-tests:
    name: Python tests (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches the CPython the app bundles (PYTHON_VERSION in
          # scripts/fetch-runtimes.mjs), so CI exercises the interpreter users
          # actually get.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create repo-local venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      # Scoped to tests/ deliberately — see pytest.ini for why a bare `pytest`
      # at the repo root cannot be used here.
      - name: Pytest
        run: .venv/bin/python -m pytest tests/
