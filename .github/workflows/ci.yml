name: CI

# Every pull request and every push to main -- once the repository is public.
#
# While it is private, every job below skips itself (a skipped job bills
# nothing). This used to fire on every push to main, where agent-authored
# commits land in bulk -- 225 in the 34h before it was made manual -- and Sep 2-5
# that was 73 runs and ~1337 billed minutes. A public repository gets unlimited
# standard-runner minutes, so the gate switches itself on the moment the
# repository is made public, with nobody having to remember to restore it.
#
# Until then it runs when dispatched by hand, and as the release workflow's
# quality gate (workflow_call with release_gate), which is not skipped.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string
      release_gate:
        description: "Called by release.yml: run regardless of repository visibility"
        required: true
        type: boolean

permissions:
  contents: read

# A newer push supersedes an older one, on a pull request and on main alike:
# agents push to main in bursts, and checking every commit of a burst re-proves
# the same tree. A release gate gets a group of its own so no push can cancel it.
concurrency:
  group: ${{ inputs.release_gate && format('ci-release-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_gate }}

jobs:
  # Skipped under the release gate: the release packages every platform itself,
  # which is a stricter build than this one.
  build:
    name: Build (${{ matrix.os }})
    if: ${{ !inputs.release_gate && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      # The only test script this job still runs, and only on Windows: it is the
      # sole check ever measured on that platform. The Linux JS suite is the
      # js-tests job below, so a broken test no longer hides a broken build.
      - name: Test mobile sprintengine command
        if: runner.os == 'Windows'
        run: node scripts/testing/run-tests.mjs src/main/mobile/sprintengine/command.test.ts

      - name: Build
        run: npm run build

  # What the JS gate covers, and why: `verify:app` -- the repo's OWN full-app
  # verification chain: typecheck, the six design lints plus the guard probes
  # that prove those lints still bite, the whole unit suite, the SDK/feed guards
  # and the release-script tests. It is named whole rather than curated: a
  # hand-maintained subset is how the gate once shrank to one script. `npm run
  # test` DISCOVERS its test files (scripts/testing/test-profiles.json), so a new
  # test file is in the gate the moment it is written. Do not narrow this step to
  # make the badge green.
  #
  # Linux only: `verify:app` has never been measured on Windows, and an
  # unmeasured chain of this size would fail that leg for reasons unrelated to
  # the change being merged.
  js-tests:
    name: JS tests (ubuntu-latest)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not incidental: `test:main:sprintengine-artifacts` refuses to mock the
      # Sprint Engine store and spawns real Python against `sprintengine_core`,
      # which exits with "PyYAML is required" without it. It prefers the
      # repo-local `.venv` and falls back to system `python3` -- and a runner's
      # system python3 has no PyYAML, so the chain needs this venv to pass.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create repo-local venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Verify app (lint + JS test suite)
        run: npm run verify:app

      # The signed registry the app installs plugins from. It was only checked
      # by the release workflow and a manual one; a broken signature found at
      # release time is a release that cannot ship.
      - name: Validate marketplace registry and plugin signatures
        run: npm run verify:marketplace-registry

  # The Python suite runs in its own job: it needs no Node toolchain, so it
  # starts without waiting on `npm ci`, and it runs on Linux only -- the suite has
  # only ever been measured on POSIX. Its own checkout also keeps pytest's
  # bytecode caches away from the marketplace payloads the JS job digest-verifies.
  python-tests:
    name: Python tests (ubuntu-latest)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches the CPython the app bundles (PYTHON_VERSION in
          # scripts/fetch-runtimes.mjs), so CI exercises the interpreter users
          # actually get.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create repo-local venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      # Scoped to tests/ deliberately -- see pytest.ini for why a bare `pytest`
      # at the repo root cannot be used here.
      - name: Pytest
        run: .venv/bin/python -m pytest tests/
