name: CI

# Every pull request and every push to main -- once the repository is public.
#
# While it is private, every job below skips itself (a skipped job bills
# nothing). This used to fire on every push to main, where agent-authored
# commits land in bulk -- 225 in the 34h before it was made manual -- and Sep 2-5
# that was 73 runs and ~1337 billed minutes. A public repository gets unlimited
# standard-runner minutes, so the gate switches itself on the moment the
# repository is made public, with nobody having to remember to restore it.
#
# Until then it runs when dispatched by hand, and as the release workflow's
# quality gate (workflow_call with release_gate), which is not skipped.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string
      release_gate:
        description: "Called by release.yml: run regardless of repository visibility"
        required: true
        type: boolean

permissions:
  contents: read

# A newer push supersedes an older one, on a pull request and on main alike:
# agents push to main in bursts, and checking every commit of a burst re-proves
# the same tree. A release gate gets a group of its own so no push can cancel it.
concurrency:
  group: ${{ inputs.release_gate && format('ci-release-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_gate }}

jobs:
  # Skipped under the release gate: the release packages every platform itself,
  # which is a stricter build than this one.
  build:
    name: Build (${{ matrix.os }})
    if: ${{ !inputs.release_gate && (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      # Windows runs only the one test file ever measured there. The Linux suite
      # is the js-tests job below, so a broken test no longer hides a broken build.
      - name: Test mobile control command
        if: runner.os == 'Windows'
        run: npx vitest run src/main/mobile/control/command.test.ts

      # macOS is where the app is developed and most of it is used, and the whole
      # suite has been measured green there: the terminal, PTY and path handling
      # it exercises differ from Linux in ways the js-tests job cannot see.
      - name: Test suite
        if: runner.os == 'macOS'
        run: npm test

      - name: Build
        run: npm run build

  # What the JS gate covers, and why: `verify:app` -- the repo's OWN full-app
  # verification chain: typecheck, the five design lints plus the guard probes
  # that prove those lints still bite, the whole unit suite, the SDK/feed guards
  # and the release-script tests. It is named whole rather than curated: a
  # hand-maintained subset is how the gate once shrank to one script. `npm run
  # test` DISCOVERS its test files (vitest.config.ts), so a new
  # test file is in the gate the moment it is written. Do not narrow this step to
  # make the badge green.
  #
  # Linux only: `verify:app` has never been measured on Windows, and an
  # unmeasured chain of this size would fail that leg for reasons unrelated to
  # the change being merged.
  js-tests:
    name: JS tests (ubuntu-latest)
    if: ${{ inputs.release_gate || github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify app (lint + JS test suite)
        run: npm run verify:app

      # The signed registry the app installs plugins from. It was only checked
      # by the release workflow and a manual one; a broken signature found at
      # release time is a release that cannot ship.
      - name: Validate marketplace registry and plugin signatures
        run: npm run verify:marketplace-registry
