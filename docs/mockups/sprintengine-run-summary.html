<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprint Engine — run summary redesign mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ---- Dark ink scale + tones, copied from src/renderer/src/assets/index.css ---- */
  :root {
    --bg-app: #08080c;
    --bg-surface: #0c0c10;
    --bg-surface-raised: #101418;
    --bg-hover: #18181c;

    --text-strong: #e6e6ec;
    --text-default: #c8c8d0;
    --text-muted: #9c9ca4;
    --text-disabled: #5c5c64;

    --border-subtle: rgba(252, 252, 252, 0.06);
    --border-default: rgba(252, 252, 252, 0.08);
    --border-strong: rgba(252, 252, 252, 0.12);

    --accent-primary: #5c7cfc;

    --tone-neutral: #9c9ca4;
    --tone-accent: #5c7cfc;
    --tone-good: #30d058;
    --tone-warn: #fcc030;
    --tone-error: #fc787c;
    --tone-neutral-soft: rgba(156, 156, 164, 0.18);
    --tone-warn-soft: rgba(252, 192, 48, 0.18);

    --tool-sprintengine: #fcc030;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-app);
    color: var(--text-default);
    font-family: "Inter", system-ui, sans-serif;
    font-feature-settings: "cv05" 1, "ss01" 1, "tnum" 0;
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    line-height: 1.45;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }

  /* ---- Mockup chrome (not part of the app; just to switch states) ---- */
  .mockbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
  }
  .mockbar .label { color: var(--text-muted); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--text-muted);
    font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border-subtle); }
  .seg button[aria-pressed="true"] { background: var(--bg-hover); color: var(--text-strong); }
  .mock-note { color: var(--text-disabled); font-size: 12px; margin-left: auto; }

  /* ---- Panel ---- */
  .panel { display: flex; flex-direction: column; min-height: 0; }
  .panel-header {
    background: var(--bg-surface);
    padding: 14px 20px 13px;
    border-bottom: 1px solid var(--border-default);
  }
  .panel-header .crumb { display: flex; align-items: center; gap: 8px; }
  .panel-header h1 {
    margin: 0; font-size: 14px; font-weight: 600; color: var(--text-strong);
  }
  .panel-header .subtitle {
    margin: 3px 0 0; font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 760px;
  }

  .scroll { overflow-y: auto; }
  .reading { width: 100%; max-width: 960px; margin: 0 auto; padding: 18px 20px 28px; }

  /* ---- Dot ---- */
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.lg { width: 7px; height: 7px; }
  .dot.neutral { background: var(--tone-neutral); }
  .dot.accent  { background: var(--tone-accent); }
  .dot.good    { background: var(--tone-good); }
  .dot.warn    { background: var(--tone-warn); }
  .dot.error   { background: var(--tone-error); }
  .dot.tool    { background: var(--tool-sprintengine); }

  /* ---- Verdict line (the one priority) ---- */
  .verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 14px; }
  .verdict .phase { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--text-strong); }
  .verdict .crumbs { display: flex; align-items: baseline; gap: 0; color: var(--text-muted); font-size: 12px; }
  .verdict .crumbs span { white-space: nowrap; }
  .verdict .crumbs span + span::before { content: "·"; margin: 0 8px; color: var(--text-disabled); }

  /* ---- Section ---- */
  .section { padding-top: 18px; }
  .section + .section { margin-top: 18px; border-top: 1px solid var(--border-subtle); }
  .section > h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--text-strong);
    display: flex; align-items: baseline; gap: 7px;
  }
  .section > h2 .count { color: var(--text-muted); font-weight: 400; }
  .empty { color: var(--text-disabled); font-size: 12px; }

  /* ---- Attention rows (needs input / open questions) ---- */
  .row { display: grid; grid-template-columns: 7px auto 1fr; gap: 9px; align-items: baseline; padding: 5px 0; }
  .row + .row { border-top: 1px solid var(--border-subtle); }
  .row .dot { margin-top: 6px; }
  .row .id { font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .row .body { min-width: 0; }
  .row .title { color: var(--text-default); }
  .row .meta { color: var(--text-muted); font-size: 12px; margin-top: 1px; }
  .row .meta .role { color: var(--text-muted); }

  .subhead { display: flex; align-items: baseline; gap: 7px; margin: 14px 0 4px; font-size: 12px; color: var(--text-muted); }
  .subhead:first-of-type { margin-top: 0; }
  .subhead .n { color: var(--text-disabled); }

  /* ---- Remaining-by-status chips (status = dot + label + count, no pills) ---- */
  .statusline { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 2px 0 8px; }
  .statusline .item { display: inline-flex; align-items: baseline; gap: 7px; font-size: 12px; }
  .statusline .item .lbl { color: var(--text-default); }
  .statusline .item .n { color: var(--text-muted); }
  .statusline .item .dot { position: relative; top: 1px; }

  /* ---- Metric strip ---- */
  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
  .metric { padding: 2px 16px 2px 0; }
  .metric + .metric { border-left: 1px solid var(--border-subtle); padding-left: 16px; }
  .metric .k { font-size: 12px; color: var(--text-muted); }
  .metric .v { font-size: 20px; font-weight: 600; color: var(--text-strong); margin-top: 3px; line-height: 1.15; }
  .metric .v .sub { font-size: 12px; font-weight: 400; color: var(--text-muted); }

  /* ---- Feedback meters ---- */
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
  .meter { display: grid; grid-template-columns: 132px 1fr 40px; align-items: center; gap: 10px; padding: 3px 0; }
  .meter .name { color: var(--text-muted); font-size: 12px; }
  .meter .track { height: 4px; border-radius: 2px; background: var(--border-subtle); overflow: hidden; }
  .meter .fill { height: 100%; background: var(--text-muted); border-radius: 2px; }
  .meter .pct { text-align: right; color: var(--text-default); font-size: 12px; }
  .meter.inverse .name::after { content: " ↓"; color: var(--text-disabled); }

  /* ---- breakdown line (findings by area) ---- */
  .breakdown { color: var(--text-muted); font-size: 12px; }
  .breakdown .pair { white-space: nowrap; }
  .breakdown .pair + .pair::before { content: "·"; margin: 0 8px; color: var(--text-disabled); }
  .breakdown .pair .n { color: var(--text-default); }

  /* ---- Per-agent breakdown table (the headline) ---- */
  .roletable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .roletable thead th {
    font-weight: 500; font-size: 11px; color: var(--text-muted); text-align: right;
    padding: 0 0 6px 14px; white-space: nowrap;
  }
  .roletable thead tr.labels th { border-bottom: 1px solid var(--border-subtle); }
  .roletable thead th.role { text-align: left; padding-left: 0; }
  .roletable thead th .inv { color: var(--text-disabled); font-weight: 400; }
  /* group spanning header */
  .roletable thead th.group { text-align: center; font-size: 10px; color: var(--text-disabled); padding: 0 0 3px; font-weight: 500; }
  /* divider between self-reported and measured clusters */
  .roletable .sep { border-left: 1px solid var(--border-subtle); }
  .roletable tbody td {
    padding: 7px 0 7px 14px; border-bottom: 1px solid var(--border-subtle);
    text-align: right; color: var(--text-default); font-variant-numeric: tabular-nums;
  }
  .roletable tbody tr:last-child td { border-bottom: 0; }
  .roletable tbody tr.idle td { color: var(--text-disabled); }
  .roletable td.role { text-align: left; padding-left: 0; }
  .roletable td.role .rname { color: var(--text-strong); }
  .roletable td.role .rrole { color: var(--text-muted); font-size: 11px; margin-left: 7px; }
  .roletable td.role .idle-tag { color: var(--text-disabled); font-size: 11px; margin-left: 7px; }
  /* self-reported cells read lighter — they are the agent's own guess, not ground truth */
  .roletable td.self { color: var(--text-muted); }
  .roletable td.na { color: var(--text-disabled); }
  .roletable td .bug { display: inline-flex; align-items: baseline; gap: 6px; justify-content: flex-end; }
  .roletable td .bug .dot { position: relative; top: -1px; }
  .glyph {
    display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
    font-size: 10px; font-weight: 600; margin-right: 9px; position: relative; top: 1px;
  }
  .footnote { color: var(--text-disabled); font-size: 11px; margin-top: 9px; }
  .footnote .self-key { color: var(--text-muted); }

  .hidden { display: none !important; }

  /* ---- footer next-step (kept, calmer) ---- */
  .nextstep {
    margin-top: 18px; display: grid; grid-template-columns: 7px 1fr; gap: 9px; align-items: baseline;
    padding-top: 14px; border-top: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 12px;
  }
  .nextstep .dot { margin-top: 5px; }
</style>
</head>

<div class="mockbar">

/* ---------- render helpers ---------- */
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function metricStrip(m) {
  // Tasks done + duration live in the verdict line; the strip is output-only so
  // no count appears twice.
  const cells = [
    { k: 'Files touched', v: m.metrics.filesTouched },
    { k: 'Commands', v: m.metrics.commands },
    { k: 'Validations', v: m.metrics.validations },
    { k: 'Gates passed', v: m.metrics.gates },
    { k: 'Findings', v: m.metrics.findings },
  ];
  return `<div class="metrics">${cells.map((c) => `
    <div class="metric"><div class="k">${esc(c.k)}</div><div class="v tnum">${c.v}</div></div>`).join('')}</div>`;
}

function meters(scores, n) {
  const rows = SCORE_LABELS.map(([key, label, inverse]) => {
    const v = scores[key];
    if (typeof v !== 'number') return '';
    return `<div class="meter${inverse ? ' inverse' : ''}">
      <span class="name">${esc(label)}</span>
      <span class="track"><span class="fill" style="width:${v}%"></span></span>
      <span class="pct tnum">${v}%</span>
    </div>`;
  }).join('');
  return `<div class="meters">${rows}</div>`;
}

function agentTable(stats) {
  // Group by role (implementers, by task volume, first); idle agents sink to the
  // bottom of their group. Whole roster is shown — idle agents read as "—".
  const ROLE_ORDER = ['architect', 'product', 'developer', 'frontend', 'tester', 'security', 'code_reviewer', 'spec_reviewer'];
  const rows = [...stats].sort((a, b) =>
    (ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role)) || (b.tasks - a.tasks) || (a.idle ? 1 : -1));
  const pct = (v) => (typeof v === 'number') ? `${v}%` : '<span class="na">—</span>';
  const cnt = (v) => (typeof v === 'number') ? `${v}` : '<span class="na">—</span>';
  return `<table class="roletable">
    <thead>
      <tr class="groups">
        <th class="role"></th><th></th>
        <th class="group sep" colspan="2">Self-reported</th>
        <th class="group sep" colspan="5">Measured · from reviews</th>
      </tr>
      <tr class="labels">
        <th class="role">Agent</th>
        <th>Tasks</th>
        <th class="sep">Confidence</th>
        <th>Halluc. risk <span class="inv">↓</span></th>
        <th class="sep">Bugs</th>
        <th>Regressions</th>
        <th>Missed reqs</th>
        <th>Halluc. rate <span class="inv">↓</span></th>
        <th>Findings raised</th>
      </tr>
    </thead>
    <tbody>${rows.map((r) => {
      const rl = ROLE[r.role] || { label: r.role, init: '?', color: 'var(--text-muted)' };
      const bug = (typeof r.bugs === 'number')
        ? (r.bugs > 0 ? `<span class="bug"><span class="dot ${r.bugTone || 'neutral'}"></span>${r.bugs}</span>` : '0')
        : '<span class="na">—</span>';
      const name = r.id.replace(/-(\d+)$/, ' $1');
      return `<tr${r.idle ? ' class="idle"' : ''}>
        <td class="role">
          <span class="glyph" style="color:${rl.color};background:${rl.color}1f">${rl.init}</span>
          <span class="rname mono">${esc(name)}</span>
          <span class="rrole">${esc(rl.label)}</span>${r.idle ? '<span class="idle-tag">idle</span>' : ''}
        </td>
        <td>${r.tasks || '<span class="na">—</span>'}</td>
        <td class="self sep">${pct(r.confidence)}</td>
        <td class="self">${pct(r.hallucGuess)}</td>
        <td class="sep">${bug}</td>
        <td>${cnt(r.regressions)}</td>
        <td>${cnt(r.missedReqs)}</td>
        <td>${pct(r.hallucRate)}</td>
        <td>${r.raised > 0 ? r.raised : (r.idle ? '<span class="na">—</span>' : '0')}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  <p class="footnote"><span class="self-key">Self-reported</span> = the agent's own end-of-task scores (its confidence and its own guess at hallucination risk). <strong>Measured</strong> = counts reviewers actually recorded against that agent's work. A high self-confidence next to a high measured bug count flags overconfidence.</p>`;
}

function renderState(key) {
  const m = STATES[key];
  document.getElementById('goal').textContent = m.goal;

  if (m.empty) {
    return `<div class="verdict"><span class="phase"><span class="dot lg neutral"></span>No tasks recorded</span></div>
      <p class="empty" style="margin-top:6px">This run has no tasks yet. Configure a roster and dispatch work to populate the summary.</p>`;
  }

  const hasRemaining = m.needsInput.length || m.openQuestions.length || m.remaining.length;
  const hasIssues = m.findings.length || m.issues.length;

  // Verdict line
  let html = `<div class="verdict">
      <span class="phase"><span class="dot lg ${m.phase.tone}"></span>${esc(m.phase.label)}</span>
      <span class="crumbs tnum">
        <span>${m.totals.done} / ${m.totals.total} tasks done</span>
        ${m.needsInput.length ? `<span>${m.needsInput.length} need input</span>` : ''}
        ${m.statusCounts.changes_requested ? `<span>${m.statusCounts.changes_requested} changes requested</span>` : ''}
        <span>ran ${esc(m.durationLabel)}</span>
      </span>
    </div>`;

  // ---- Section: what's left (conditional) ----
  let remainingHtml = '';
  if (hasRemaining) {
    remainingHtml += `<section class="section"><h2>What's left <span class="count tnum">${m.needsInput.length + m.openQuestions.length + m.remaining.length}</span></h2>`;

    if (m.needsInput.length) {
      remainingHtml += `<div class="subhead">Needs your input <span class="n tnum">${m.needsInput.length}</span></div>`;
      remainingHtml += m.needsInput.map((q) => `
        <div class="row"><span class="dot error"></span>
          <span class="id">${esc(q.id)}</span>
          <span class="body"><span class="title">${esc(q.reason)}</span>
            <div class="meta"><span class="role">${esc(q.role)}</span></div></span>
        </div>`).join('');
    }
    if (m.openQuestions.length) {
      remainingHtml += `<div class="subhead">Open questions <span class="n tnum">${m.openQuestions.length}</span></div>`;
      remainingHtml += m.openQuestions.map((q) => `
        <div class="row"><span class="dot warn"></span>
          <span class="id">${esc(q.id)}</span>
          <span class="body"><span class="title">${esc(q.note)}</span></span>
        </div>`).join('');
    }
    if (m.remaining.length) {
      remainingHtml += `<div class="subhead">Still open <span class="n tnum">${m.remaining.length}</span></div>`;
      const remainingStatuses = {};
      m.remaining.forEach((t) => { remainingStatuses[t.status] = (remainingStatuses[t.status] || 0) + 1; });
      remainingHtml += `<div class="statusline">${Object.entries(remainingStatuses).map(([s, n]) => `
        <span class="item"><span class="dot ${STATUS_TONE[s] || 'neutral'}"></span><span class="lbl">${esc(STATUS_LABEL[s] || s)}</span><span class="n tnum">${n}</span></span>`).join('')}</div>`;
      remainingHtml += m.remaining.map((t) => `
        <div class="row"><span class="dot ${STATUS_TONE[t.status] || 'neutral'}"></span>
          <span class="id">${esc(t.id)}</span>
          <span class="body"><span class="title">${esc(t.title)}</span>
            <div class="meta"><span class="role">${esc(t.role)}</span></div></span>
        </div>`).join('');
    }
    remainingHtml += `</section>`;
  }

  // ---- Section: per-agent breakdown (the headline) ----
  let roleHtml = '';
  if (m.agentStats && m.agentStats.length) {
    roleHtml = `<section class="section"><h2>Per-agent breakdown <span class="count tnum">${m.agentStats.length}</span></h2>${agentTable(m.agentStats)}</section>`;
  }

  // ---- Section: issues during the run ----
  let issuesHtml = `<section class="section"><h2>Issues during the run <span class="count tnum">${m.metrics.findings + m.issues.length}</span></h2>`;
  if (hasIssues) {
    if (m.findings.length) {
      const sevCounts = { critical: 0, high: 0, medium: m.findingsLower.medium, low: m.findingsLower.low };
      m.findings.forEach((f) => { sevCounts[f.sev] = (sevCounts[f.sev] || 0) + 1; });
      issuesHtml += `<div class="statusline">${['critical', 'high', 'medium', 'low'].filter((s) => sevCounts[s]).map((s) => `
        <span class="item"><span class="dot ${SEV_TONE[s]}"></span><span class="lbl">${SEV_LABEL[s]}</span><span class="n tnum">${sevCounts[s]}</span></span>`).join('')}</div>`;
      issuesHtml += m.findings.map((f) => `
        <div class="row"><span class="dot ${SEV_TONE[f.sev]}"></span>
          <span class="id">${esc(f.id)}</span>
          <span class="body"><span class="title">${esc(f.title)}</span>
            <div class="meta">${esc(f.kind)} · ${esc(f.area)}${f.status === 'fixed' ? ' · fixed' : ''}</div></span>
        </div>`).join('');
      const lower = m.findingsLower.medium + m.findingsLower.low;
      if (lower) issuesHtml += `<div class="subhead" style="margin-top:8px">+ ${lower} lower-severity finding${lower === 1 ? '' : 's'} not shown</div>`;
    }
    if (m.issues.length) {
      issuesHtml += `<div class="subhead" style="margin-top:14px">Prompt &amp; process signals <span class="n tnum">${m.issues.length}</span></div>`;
      issuesHtml += m.issues.map((i) => `
        <div class="row"><span class="dot ${SEV_TONE[i.sev]}"></span>
          <span class="id">${esc(i.id)}</span>
          <span class="body"><span class="title">${esc(i.title)}</span>
            <div class="meta">${SEV_LABEL[i.sev]} · ${esc(i.category)}${i.prompt ? ` — ${esc(i.prompt)}` : ''}</div></span>
        </div>`).join('');
    }
  } else {
    issuesHtml += `<p class="empty">No findings or prompt signals were reported this run.</p>`;
  }
  issuesHtml += `</section>`;

  // ---- Section: run metrics (output volume — no overlap with verdict) ----
  let metricsHtml = `<section class="section"><h2>Run metrics</h2>${metricStrip(m)}`;
  if (m.findingsByArea.length) {
    metricsHtml += `<div class="subhead" style="margin-top:16px">Findings by area</div>
      <div class="breakdown">${m.findingsByArea.map(([a, n]) => `<span class="pair">${esc(a)} <span class="n tnum">${n}</span></span>`).join('')}</div>`;
  }
  metricsHtml += `</section>`;

  // ---- Section: process health (input/process feedback, all dimensions) ----
  const feedbackHtml = `<section class="section"><h2>Process health <span class="count tnum">avg across ${m.scoreTaskCount} task${m.scoreTaskCount === 1 ? '' : 's'}</span></h2>${meters(m.scores, m.scoreTaskCount)}</section>`;

  // Assemble: verdict → headline per-role → issues → what's left → metrics → process health
  html += roleHtml + issuesHtml + remainingHtml + metricsHtml + feedbackHtml;
  html += `<div class="nextstep"><span class="dot warn"></span><span>Next step: manually test the uncommitted changes in the workspace before committing or reverting.</span></div>`;

  return html;
}

function select(key) {
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === key)));
  document.getElementById('report').innerHTML = renderState(key);
}
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => select(b.dataset.state)));
select('complete');
</script>
</body>
</html>
